<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Barbeiro - Gestão</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #2c2f33;
            color: #ffffff;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1c40f;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #f1c40f;
            font-size: 1.4rem;
        }
        .header a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .filters {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .filters span {
            font-size: 0.9rem;
            margin-right: 10px;
        }
        .filters button {
            background-color: #40444b;
            color: #ffffff;
            border: none;
            padding: 6px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .filters button.active {
            background-color: #f1c40f;
            color: #000000;
            font-weight: bold;
        }
        .dashboard-cards {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .card {
            background-color: #36393f;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 1px solid #2f3136;
        }
        .card-title {
            font-size: 0.75rem;
            color: #b9bbbe;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .card-value {
            font-size: 1.6rem;
            font-weight: bold;
        }
        .card-value.money {
            color: #43b581;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #36393f;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #2f3136;
            font-size: 0.85rem;
        }
        th {
            color: #f1c40f;
            font-weight: bold;
            background-color: #2f3136;
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #32353b;
        }
        .loading, .error {
            text-align: center;
            padding: 20px;
            color: #b9bbbe;
        }
        .status-select {
            background-color: #2f3136;
            color: #fff;
            border: 1px solid #40444b;
            padding: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .action-btn {
            background-color: transparent;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .action-btn:hover {
            background-color: #e74c3c;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Painel do Barbeiro - Gestão</h1>
        <a href="index.html">Voltar ao Site</a>
    </div>

    <div class="filters">
        <span>Filtrar período:</span>
        <button class="active" onclick="filtrar('hoje', this)">Hoje</button>
        <button onclick="filtrar('semana', this)">Esta Semana</button>
        <button onclick="filtrar('mes', this)">Este Mês</button>
        <button onclick="filtrar('todos', this)">Todos</button>
    </div>

    <div class="dashboard-cards">
        <div class="card">
            <div class="card-title">TOTAL DE CORTES AGENDADOS</div>
            <div class="card-value" id="total-cortes">0</div>
        </div>
        <div class="card">
            <div class="card-title">FATURAMENTO TOTAL</div>
            <div class="card-value money" id="total-valor">R$ 0,00</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>CLIENTE</th>
                <th>CONTATO</th>
                <th>SERVIÇO</th>
                <th>HORÁRIO</th>
                <th>VALOR</th>
                <th>STATUS</th>
                <th>AÇÕES</th>
            </tr>
        </thead>
        <tbody id="tabela-agendamentos">
            <tr><td colspan="7" class="loading">Carregando agendamentos...</td></tr>
        </tbody>
    </table>

    <script>
        let todosAgendamentos = [];

        async function carregarAgendamentos() {
            try {
                const response = await fetch('http://localhost:8080/api/appointments');
                todosAgendamentos = await response.json();
                renderizarTabela(todosAgendamentos);
            } catch (error) {
                document.getElementById('tabela-agendamentos').innerHTML = 
                    '<tr><td colspan="7" class="error">Erro ao carregar dados. Verifique o servidor.</td></tr>';
            }
        }

        async function atualizarStatus(id, novoStatus) {
            try {
                await fetch(`http://localhost:8080/api/appointments/${id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: novoStatus })
                });
                carregarAgendamentos();
            } catch (e) {
                console.error("Erro ao atualizar status", e);
            }
        }

        async function excluirAgendamento(id) {
            if (confirm("Deseja realmente excluir este agendamento?")) {
                try {
                    const response = await fetch(`http://localhost:8080/api/appointments/${id}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        carregarAgendamentos();
                    } else {
                        alert("Erro ao excluir agendamento.");
                    }
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function renderizarTabela(dados) {
            const tbody = document.getElementById('tabela-agendamentos');
            tbody.innerHTML = '';
            
            document.getElementById('total-cortes').innerText = dados.length;
            
            let faturamento = 0;

            if (dados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="loading">Nenhum agendamento encontrado.</td></tr>';
                document.getElementById('total-valor').innerText = 'R$ 0,00';
                return;
            }

            dados.forEach(agendamento => {
                const tr = document.createElement('tr');
                
                const cliente = agendamento.clientName || '-';
                const contato = agendamento.clientPhone || '-';
                const servicoNome = agendamento.service ? (agendamento.service.name || 'Corte') : '-';
                const valor = agendamento.service && agendamento.service.price ? parseFloat(agendamento.service.price) : 0;
                
                let horarioFormatado = '-';
                if (agendamento.dateTime) {
                    const dataObj = new Date(agendamento.dateTime);
                    horarioFormatado = dataObj.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
                }

                const statusAtual = agendamento.status || 'Pendente';
                
                // Soma apenas se não estiver cancelado
                if (statusAtual !== 'Cancelado') {
                    faturamento += valor;
                }

                tr.innerHTML = `
                    <td>${cliente}</td>
                    <td>${contato}</td>
                    <td>${servicoNome}</td>
                    <td>${horarioFormatado}</td>
                    <td>R$ ${valor.toFixed(2).replace('.', ',')}</td>
                    <td>
                        <select class="status-select" onchange="atualizarStatus(${agendamento.id}, this.value)">
                            <option value="Pendente" ${statusAtual === 'Pendente' ? 'selected' : ''}>Pendente</option>
                            <option value="Concluído" ${statusAtual === 'Concluído' ? 'selected' : ''}>Concluído</option>
                            <option value="Cancelado" ${statusAtual === 'Cancelado' ? 'selected' : ''}>Cancelado</option>
                        </select>
                    </td>
                    <td>
                        <button class="action-btn" onclick="excluirAgendamento(${agendamento.id})">Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            document.getElementById('total-valor').innerText = `R$ ${faturamento.toFixed(2).replace('.', ',')}`;
        }

        window.onload = carregarAgendamentos;
    </script>
</body>
</html>
